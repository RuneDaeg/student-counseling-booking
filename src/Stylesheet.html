<!-- powered by 여광재 (온양고등학교) | https://github.com/RuneDaeg/student-counseling-booking -->
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --text: #1c212c;
    --muted: #6b7482;
    --line: #e2e6ee;
    --primary: #2f66d0;
    --primary-soft: #eaf0fd;
    --danger: #c5372c;
    --ok: #2f7d54;
    --warn: #b26b00;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #13161c;
      --card: #1b1f27;
      --text: #e8eaf0;
      --muted: #9aa3b2;
      --line: #2b313c;
      --primary: #6b9bf5;
      --primary-soft: #223050;
      --danger: #ef7d72;
      --ok: #6ec48f;
      --warn: #e0a640;
    }
  }

  * { box-sizing: border-box; }
  /* .row3 같은 display 규칙이 hidden 속성을 덮어쓰지 않도록 */
  [hidden] { display: none !important; }
  body {
    margin: 0;
    padding: 20px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }
  main, section.card, footer { max-width: 520px; margin-left: auto; margin-right: auto; }

  .head { max-width: 520px; margin: 0 auto 18px; }
  h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -0.02em; }
  .notice { margin: 0; color: var(--muted); white-space: pre-wrap; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 18px 20px;
    margin-bottom: 14px;
  }
  .card h2 {
    font-size: 16px;
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
  }
  .sub { margin: -6px 0 12px; color: var(--muted); font-weight: 600; }

  /* 달력 */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-head strong { font-size: 15px; }
  .nav {
    width: 34px; height: 34px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    border-radius: 9px;
    font-size: 18px;
    cursor: pointer;
  }
  .nav:disabled { opacity: .3; cursor: default; }
  .cal-dow, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow { margin-bottom: 4px; font-size: 12px; color: var(--muted); text-align: center; }
  .cal-dow .sat { color: #4a7fd0; }
  .cal-dow .sun { color: #cf6a6a; }
  .cell {
    aspect-ratio: 1 / 1;
    border: 1px solid transparent;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: default;
    padding: 0;
  }
  .cell.blank { visibility: hidden; }
  .cell.open {
    background: var(--primary-soft);
    color: var(--text);
    border-color: transparent;
    font-weight: 600;
    cursor: pointer;
  }
  .cell.open:hover { border-color: var(--primary); }
  .cell.selected { background: var(--primary); color: #fff; }
  .cell.blocked, .cell.full { text-decoration: line-through; opacity: .5; }
  .cell[aria-disabled="true"]:not(.blank) { cursor: help; }
  .cell .mark { width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: .7; }
  .cell.selected .mark { background: #fff; }

  .legend { margin: 12px 0 0; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-left: 8px; }
  .dot:first-child { margin-left: 0; }
  .dot.open { background: var(--primary); }
  .dot.blocked { background: #b9bfca; }
  .dot.full { background: #d8b26a; }
  .legend.hint-tap { margin-top: 6px; display: block; }

  /* 시간 */
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
  .slot {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    border-radius: 10px;
    padding: 11px 6px;
    font-size: 14px;
    font-family: inherit;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
  }
  .slot:hover { border-color: var(--primary); }
  .slot.selected { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  .slot.off {
    color: var(--muted);
    background: var(--bg);
    border-style: dashed;
    text-decoration: line-through;
    cursor: help;
  }
  .slot.off:hover { border-color: var(--muted); }

  /* 안내 말풍선 */
  .tip {
    position: absolute;
    z-index: 20;
    max-width: 240px;
    padding: 8px 11px;
    border-radius: 9px;
    background: #2b3240;
    color: #f4f6fa;
    font-size: 12.5px;
    line-height: 1.45;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .22);
    pointer-events: none;
  }
  .tip::after {
    content: '';
    position: absolute;
    left: var(--arrow, 50%);
    margin-left: -5px;
    border: 5px solid transparent;
    border-top-color: #2b3240;
    top: 100%;
  }
  .tip.below::after { top: auto; bottom: 100%; border-top-color: transparent; border-bottom-color: #2b3240; }
  @media (prefers-color-scheme: dark) {
    .tip { background: #39414f; }
    .tip::after { border-top-color: #39414f; }
    .tip.below::after { border-top-color: transparent; border-bottom-color: #39414f; }
  }

  /* 입력 */
  label { display: block; margin-bottom: 14px; font-size: 13px; color: var(--muted); font-weight: 600; }
  input, select, textarea {
    display: block;
    width: 100%;
    margin-top: 6px;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    line-height: 1.5;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: 1px; border-color: transparent; }
  textarea { resize: vertical; min-height: 140px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .opt { font-weight: 400; }
  .window-msg {
    max-width: 520px;
    margin: 0 auto 14px;
    padding: 16px 18px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--card);
    color: var(--text);
    font-weight: 600;
    text-align: center;
  }
  .fixed-who {
    margin: 0 0 14px;
    padding: 9px 12px;
    background: var(--primary-soft);
    border-radius: 9px;
    font-weight: 700;
    font-size: 14px;
  }
  .concern-label { position: relative; }
  .counter { float: right; color: var(--muted); font-weight: 400; }
  .hint { margin: -8px 0 14px; font-size: 12px; color: var(--muted); }

  .check { display: flex; gap: 10px; align-items: flex-start; background: var(--bg); border-radius: 10px; padding: 12px; color: var(--text); font-weight: 400; font-size: 13px; }
  .check input { width: 18px; height: 18px; margin: 2px 0 0; flex: none; }
  .check em { display: block; color: var(--muted); font-style: normal; font-size: 12px; margin-top: 4px; }

  /* 버튼 */
  .btn {
    width: 100%;
    padding: 13px;
    border-radius: 11px;
    border: 1px solid transparent;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  .btn.primary { background: var(--primary); color: #fff; }
  .btn.primary:disabled { opacity: .55; cursor: default; }
  .btn.ghost { background: transparent; border-color: var(--line); color: var(--text); }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .linkish { background: none; border: none; color: var(--muted); font-size: 13px; font-family: inherit; text-decoration: underline; cursor: pointer; padding: 4px; }
  .cancel-link { text-align: center; margin: 4px 0 0; }

  .err { color: var(--danger); font-size: 13px; margin: 0 0 12px; white-space: pre-wrap; }
  .ok { color: var(--ok); font-size: 13px; margin: 0 0 12px; }

  /* 완료 */
  .done { text-align: center; }
  .check-mark {
    width: 52px; height: 52px; margin: 4px auto 12px;
    border-radius: 50%;
    background: var(--primary-soft);
    color: var(--primary);
    font-size: 26px;
    display: flex; align-items: center; justify-content: center;
  }
  .done h2 { justify-content: center; }
  .done-when { font-weight: 700; margin: 0 0 14px; }
  .ticket {
    background: var(--bg);
    border: 1px dashed var(--line);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .ticket span { display: block; font-size: 12px; color: var(--muted); }
  .ticket strong { font-size: 22px; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }

  /* 로딩 */
  .center-box { max-width: 520px; margin: 60px auto; text-align: center; color: var(--muted); }
  .spinner {
    width: 26px; height: 26px; margin: 0 auto 14px;
    border: 3px solid var(--line);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fatal-msg { color: var(--danger); white-space: pre-wrap; }

  .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; }
  .credit { display: block; margin-top: 6px; letter-spacing: .01em; }
  .credit b { font-weight: 700; }

  @media (max-width: 380px) {
    .row3 { gap: 6px; }
    .slots { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
  }
</style>
